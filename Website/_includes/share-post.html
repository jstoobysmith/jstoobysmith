{% assign share_url   = page.url | absolute_url | url_encode %}
{% assign share_title = page.title | url_encode %}
<div class="post-share">
  <span class="post-share-label">Share</span>
  <ul class="post-share-links">
    <li>
      <a href="https://bsky.app/intent/compose?text={{ share_title }}%20{{ share_url }}"
         target="_blank" rel="noopener">
        <i class="fab fa-bluesky" aria-hidden="true"></i> Bluesky
      </a>
    </li>
    <li>
      <a href="https://twitter.com/intent/tweet/?text={{ share_title }}&amp;url={{ share_url }}"
         target="_blank" rel="noopener">
        <i class="fab fa-x-twitter" aria-hidden="true"></i> X
      </a>
    </li>
    <li>
      <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ share_url }}"
         target="_blank" rel="noopener">
        <i class="fab fa-linkedin-in" aria-hidden="true"></i> LinkedIn
      </a>
    </li>
    <li>
      <a href="https://news.ycombinator.com/submitlink?u={{ share_url }}&amp;t={{ share_title }}"
         target="_blank" rel="noopener">
        <i class="fab fa-hacker-news" aria-hidden="true"></i> Hacker News
      </a>
    </li>
    <li>
      <a href="mailto:?subject={{ page.title | uri_escape }}&amp;body={{ page.url | absolute_url | uri_escape }}">
        <i class="fas fa-envelope" aria-hidden="true"></i> Email
      </a>
    </li>
  </ul>
</div>
